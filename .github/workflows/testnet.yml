name: Testnet record

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    paths:
      - deployments/**
      - contracts/outcome-vault/outcome_vault.wasm.sha256

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          cache: true
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check every recorded transaction, ledger and the deployed code on NEAR testnet
        run: pnpm verify:testnet
