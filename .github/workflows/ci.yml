name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          cache: true
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Check formatting
        run: pnpm format:check
      - name: Test
        run: pnpm test
      - name: Replay the recovery episode
        run: pnpm episode recovery
      - name: Re-prove the headline claims
        run: pnpm judge

  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: contracts/outcome-vault
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Rust 1.94.1
        run: |
          rustup toolchain install 1.94.1 --profile minimal --component clippy,rustfmt --target wasm32-unknown-unknown
          rustup default 1.94.1
      - name: Check formatting
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Build the contract
        run: cargo build --target wasm32-unknown-unknown --release --locked

  chain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Rust 1.94.1
        run: |
          rustup toolchain install 1.94.1 --profile minimal --target wasm32-unknown-unknown
          rustup default 1.94.1
      - name: Build the contract reproducibly
        run: sh scripts/build-vault.sh | tee vault-build.txt
      - name: Publish the built wasm
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: outcome-vault-wasm
          path: contracts/outcome-vault/target/wasm32-unknown-unknown/release/outcome_vault.wasm
      - name: Preserve the candidate checksum beside the artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: outcome-vault-candidate-checksum
          path: vault-build.txt
      - name: Reproduce the deployed build from its pinned source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 4e553a88bf1038fc3db6f5ca4e479697330dacd1
          path: vault-release
          sparse-checkout: |
            contracts/outcome-vault
            scripts/build-vault.sh
          sparse-checkout-cone-mode: false
      - name: Match the published deployment hash
        run: |
          sh vault-release/scripts/build-vault.sh > vault-release-build.txt
          test "$(tail -n 1 vault-release-build.txt)" = "$(cat contracts/outcome-vault/outcome_vault.wasm.sha256)"
      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          cache: true
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Run the vault on a local NEAR node
        run: pnpm test:chain
      - name: Replay the recovery episode on a local NEAR node
        run: pnpm chain sandbox
      - name: Run the live swarm settling on a local NEAR node
        run: pnpm demo --chain sandbox
