[package]
name = "outcome-vault"
version = "0.1.0"
edition = "2021"
rust-version = "1.94"
resolver = "3"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "=5.29.1", features = ["unstable"] }

[dev-dependencies]
near-sdk = { version = "=5.29.1", features = ["unit-testing", "unstable"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
strip = true
panic = "abort"
overflow-checks = true

[profile.dev.package."*"]
opt-level = 2
